name: Build and publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record workflow start
        id: timing
        shell: pwsh
        run: |
          $run = gh run view $env:GITHUB_RUN_ID --json startedAt --jq .startedAt
          "started=$run" >> $env:GITHUB_OUTPUT

      - name: Bootstrap declared dependencies
        run: .\download-dependencies.bat /s

      - name: Build the application
        run: .\build.bat /s

      - name: Build and verify the unsigned Squirrel.Windows installer
        run: .\build-installer.bat /s

      - name: Collect release files and evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/release-staging | Out-Null
          if (Test-Path dist/squirrel-windows) {
            pwsh -NoProfile -File scripts/collect-release-assets.ps1 -OutputPath dist/squirrel-windows -DestinationPath packaging/release-staging
          }
          pwsh -NoProfile -File scripts/count-lines.ps1 -OutputPath packaging/release-staging/line-count.json

      - name: Upload safe build outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-release-evidence-${{ github.run_id }}
          path: |
            packaging/release-staging/**
            dist/squirrel-windows/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify release lap saps
        if: ${{ success() }}
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $receipt = Get-ChildItem dist/squirrel-windows/source-receipt.json
          if (-not $receipt) { throw 'The source receipt is missing.' }
          pwsh -NoProfile -File scripts/verify-squirrel-package.ps1 -OutputPath dist/squirrel-windows -ExpectedCommit $sha | Set-Content packaging/release-staging/package-verification.json

      - name: Select unique release tag
        if: ${{ success() }}
        id: release
        shell: pwsh
        run: |
          $tag = pwsh -NoProfile -File scripts/new-release-tag.ps1 -Version '0.1.0' -RunNumber $env:GITHUB_RUN_NUMBER -RunAttempt $env:GITHUB_RUN_ATTEMPT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          git tag $tag $env:GITHUB_SHA
          git push origin $tag

      - name: Create one temporary draft release
        if: ${{ success() }}
        id: draft
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title "Wording Lens $env:RELEASE_TAG" --notes 'Preparing verified release assets.'
          $records = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json databaseId,tagName,draft | ConvertFrom-Json
          $record = @($records | Where-Object { $_.tagName -eq $env:RELEASE_TAG }) | Select-Object -First 1
          if (-not $record) { throw 'The temporary draft release was not found after creation.' }
          "release_id=$($record.databaseId)" >> $env:GITHUB_OUTPUT

      - name: Upload verified release assets to the draft
        if: ${{ success() }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem packaging/release-staging -File | Where-Object { $_.Name -match '(-Setup\.exe$|^RELEASES$|\.nupkg$|\.nupkg\.sha512$)' } | ForEach-Object FullName)
          if ($assets.Count -lt 3) { throw 'Release asset collection did not find Setup.exe, RELEASES, and a full .nupkg.' }
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY $assets

      - name: Capture completion time after asset publication
        if: ${{ success() }}
        id: completion
        shell: pwsh
        run: |
          $completed = (Get-Date).ToUniversalTime().ToString('o')
          "completed=$completed" >> $env:GITHUB_OUTPUT

      - name: Write and update draft release notes by release ID
        if: ${{ success() }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          STARTED_AT: ${{ steps.timing.outputs.started }}
          COMPLETED_AT: ${{ steps.completion.outputs.completed }}
        run: |
          pwsh -NoProfile -File scripts/write-release-notes.ps1 -OutputPath packaging/release-staging/RELEASE-NOTES.md -Tag $env:RELEASE_TAG -StartedAt $env:STARTED_AT -CompletedAt $env:COMPLETED_AT -LineCountPath packaging/release-staging/line-count.json -ReceiptPath dist/squirrel-windows/source-receipt.json -CodeName 'Classic Har Gow · 蝦餃' -CodeNameUrl 'https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/latest'
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F "body=@packaging/release-staging/RELEASE-NOTES.md"

      - name: Publish the draft exactly once and verify it is non-draft
        if: ${{ success() }}
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F "draft=false" | Out-Null
          $record = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($record.draft -ne $false -or $record.tag_name -ne $env:RELEASE_TAG) { throw 'Published release verification failed.' }
