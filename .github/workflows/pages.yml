name: Build and deploy documentation site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}

jobs:
  build:
    runs-on: windows-2025
    env:
      SITE_BASE_PATH: /wording-lens
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bootstrap the exact Node toolchain, install site dependencies, and build
        shell: pwsh
        run: |
          & scripts/bootstrap-dependencies.ps1 -Silent
          if ($LASTEXITCODE -ne 0) { throw "Dependency bootstrap exited with $LASTEXITCODE." }
          $npm = Get-Command npm.cmd -ErrorAction Stop
          if (-not (Test-Path apps/site/package.json)) { throw 'No site package manifest was found.' }
          Push-Location apps/site
          try {
            & $npm.Source ci --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw "apps/site npm ci exited with $LASTEXITCODE." }
            & $npm.Source run build
            if ($LASTEXITCODE -ne 0) { throw "apps/site build exited with $LASTEXITCODE." }
          } finally { Pop-Location }
          if (-not (Test-Path apps/site/dist/client/index.html)) { throw 'The site build did not produce apps/site/dist/client/index.html.' }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist/client

  deploy:
    needs: build
    runs-on: windows-2025
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
